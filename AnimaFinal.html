<!DOCTYPE html>
<html>
<head>
    <title>Animation Frame Exporter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px; background: #0f0f0f; color: #eee; }
        .ui-card { background: #1a1a1a; padding: 20px; border-radius: 12px; width: 480px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .slider-group { margin: 15px 0; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 5px; color: #00d4ff; font-size: 0.9em; font-weight: bold; }
        input[type="range"] { width: 100%; accent-color: #00d4ff; }
        .toggle-row { display: flex; gap: 20px; margin: 15px 0; padding: 12px; background: #252525; border-radius: 8px; border: 1px solid #333; }
        canvas { border: 2px solid #444; background: white; max-width: 100%; margin-top: 15px; border-radius: 4px; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; background: #00d4ff; color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button.alt { background: #ffeb3b; }
        button:hover { opacity: 0.8; transform: translateY(-1px); }
        button:disabled { background: #444; color: #777; cursor: not-allowed; }
        #statusText { margin-top: 15px; font-weight: bold; color: #00d4ff; text-align: center; font-size: 0.85em; }
    </style>
</head>
<body>

    <div class="ui-card">
        <h3 style="margin:0 0 15px 0;">Frame-by-Frame Animator</h3>
        <input type="file" id="upload" accept="video/*" style="width: 100%; color: #fff; margin-bottom: 10px;">
        
        <div class="slider-group">
            <div class="label-row"><span>Target FPS</span><span id="fpsVal">12</span></div>
            <input type="range" id="fpsIn" min="1" max="60" value="12">
        </div>

        <div class="toggle-row">
            <label style="cursor:pointer"><input type="checkbox" id="outlineToggle" checked> Enable Outlines</label>
        </div>

        <div id="sensContainer" class="slider-group">
            <div class="label-row"><span>Line Sensitivity</span><span id="sensVal">5.0</span></div>
            <input type="range" id="sensIn" min="0.1" max="100" step="0.1" value="5">
        </div>
        
        <div class="btn-group">
            <button id="goBtn" disabled>SAVE AS VIDEO</button>
            <button id="zipBtn" class="alt" disabled>SAVE AS ZIP (FRAMES)</button>
        </div>
        <div id="statusText">Upload a video to start.</div>
    </div>

    <video id="v" hidden crossorigin="anonymous"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const v = document.getElementById('v');
        const c = document.getElementById('c');
        const ctx = c.getContext('2d', { willReadFrequently: true });
        const btnVideo = document.getElementById('goBtn');
        const btnZip = document.getElementById('zipBtn');
        const statusText = document.getElementById('statusText');
        const outlineToggle = document.getElementById('outlineToggle');

        // UI Updates
        const linkUI = (id, target) => {
            const el = document.getElementById(id);
            el.oninput = () => document.getElementById(target).innerText = el.value;
        };
        linkUI('fpsIn', 'fpsVal');
        linkUI('sensIn', 'sensVal');

        document.getElementById('upload').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                v.src = URL.createObjectURL(file);
                v.onloadedmetadata = () => { 
                    btnVideo.disabled = btnZip.disabled = false; 
                    c.width = v.videoWidth; 
                    c.height = v.videoHeight;
                    statusText.innerText = "Video loaded. Ready to export.";
                };
            }
        };

        function getLum(data, i) { return 0.2126 * data[i] + 0.7151 * data[i+1] + 0.0721 * data[i+2]; }

        function applyOutlines() {
            if (!outlineToggle.checked) return;
            const w = c.width, h = c.height;
            const imgData = ctx.getImageData(0, 0, w, h);
            const pix = imgData.data;
            const output = ctx.createImageData(w, h);
            const out = output.data;
            const threshold = parseFloat(document.getElementById('sensIn').value);

            for (let i = 0; i < pix.length; i += 4) {
                const x = (i / 4) % w;
                const y = Math.floor((i / 4) / w);
                if (x >= w - 1 || y >= h - 1) continue;
                const r = i + 4, b = i + (w * 4);
                const diff = Math.max(Math.abs(getLum(pix, i) - getLum(pix, r)), Math.abs(getLum(pix, i) - getLum(pix, b)));
                const val = diff > threshold ? 0 : 255;
                out[i] = out[i+1] = out[i+2] = val; out[i+3] = 255;
            }
            ctx.putImageData(output, 0, 0);
        }

        // --- NEW ZIP LOGIC ---
        btnZip.onclick = async () => {
            const zip = new JSZip();
            const fps = parseInt(document.getElementById('fpsIn').value);
            const duration = v.duration;
            const totalFrames = Math.floor(duration * fps);
            
            btnVideo.disabled = btnZip.disabled = true;
            statusText.innerText = "Capturing frames...";

            for (let i = 0; i < totalFrames; i++) {
                // Seek video to the specific frame time
                v.currentTime = i / fps;
                await new Promise(r => v.onseeked = r);

                // Draw and process
                ctx.drawImage(v, 0, 0, c.width, c.height);
                applyOutlines();

                // Convert canvas to image and add to ZIP
                const imgData = c.toDataURL("image/jpeg", 0.9);
                const base64Data = imgData.replace(/^data:image\/(png|jpeg);base64,/, "");
                zip.file(`frame_${i.toString().padStart(4, '0')}.jpg`, base64Data, {base64: true});

                statusText.innerText = `Processing Frame: ${i + 1} / ${totalFrames}`;
            }

            statusText.innerText = "Creating ZIP folder... (might freeze for a second)";
            const content = await zip.generateAsync({type:"blob"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = "animation_frames.zip";
            link.click();

            statusText.innerText = "ZIP Downloaded!";
            btnVideo.disabled = btnZip.disabled = false;
        };

        // Video Export (same as before)
        btnVideo.onclick = () => {
            const fps = parseInt(document.getElementById('fpsIn').value);
            const stream = c.captureStream(fps);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = "animation.webm";
                a.click();
                statusText.innerText = "Video Downloaded!";
                btnVideo.disabled = btnZip.disabled = false;
            };
            btnVideo.disabled = btnZip.disabled = true;
            statusText.innerText = "Recording video...";
            recorder.start();
            v.play();
            const timer = setInterval(() => {
                if (v.ended) { clearInterval(timer); recorder.stop(); return; }
                ctx.drawImage(v, 0, 0, c.width, c.height);
                applyOutlines();
            }, 1000 / fps);
        };
    </script>
</body>
</html>
